<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>הפחמרגוזים · קיץ 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,800;0,900;1,700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=2026.11" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared live voting (optional) — fill in components/firebase-config.js to enable -->
  <script src="components/firebase-config.js?v=2026.11"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Map library for the per-leg place maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    window.__tweaks = {
      familyName: 'הפחמרגוזים · קיץ 2026',
      heroTitle: 'הקיץ הגדול',
      heroSubtitle: 'קיץ 2026',
    };
    document.documentElement.setAttribute('data-theme', 'modern');
  </script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel" src="components/Stickers.jsx?v=2026.11"></script>
  <script type="text/babel" src="components/Data.jsx?v=2026.11"></script>
  <script type="text/babel" src="components/Vote.jsx?v=2026.11"></script>
  <script type="text/babel" src="components/Sections.jsx?v=2026.11"></script>
  <script type="text/babel" src="components/Hero.jsx?v=2026.11"></script>

  <script type="text/babel">
    function Footer({ familyName }) {
      return (
        <footer style={{
          marginTop: 80,
          padding: '40px 0 20px',
          borderTop: '2px dashed var(--ink-faded)',
          textAlign: 'center',
          color: 'var(--ink-faded)',
        }}>
          <div className="handwritten" style={{ fontSize: 42, color: 'var(--ink-soft)', marginBottom: 8 }}>
            שיהיה טיול מדהים
          </div>
          <div className="label">{familyName}</div>
          <div style={{ marginTop: 18, fontSize: 13 }}>
            עשוי באהבה · ההצבעות נשמרות אוטומטית
          </div>
          <button
            onClick={() => {
              const shared = (typeof voteMode === 'function') && voteMode() === 'firebase';
              const msg = shared
                ? '⚠️ במצב משותף זה מוחק את ההצבעות של כל המשפחות, לא רק שלך. להמשיך?'
                : 'למחוק את כל ההצבעות במכשיר הזה?';
              if (confirm(msg)) resetVotes();
            }}
            style={{
              marginTop: 16, padding: '8px 16px', background: 'transparent',
              color: 'var(--ink-faded)', border: '1px dashed var(--ink-faded)',
              cursor: 'pointer', fontFamily: 'inherit', fontSize: 13,
            }}
          >לאפס הצבעות</button>
        </footer>
      );
    }

    function App() {
      const familyName = window.__tweaks.familyName;
      return (
        <div className="page">
          <Hero />
          <FamilySection />
          <ExtendedFamilySection />
          <section style={{ paddingTop: 20, paddingBottom: 0 }}>
            <HowVoting />
          </section>
          <IdentityPicker />
          {LEGS.map((leg, i) => (
            <LegSection key={leg.id} leg={leg} index={i} />
          ))}
          <Footer familyName={familyName} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
